[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard-audit"
version = "1.0.0"
description = "A scoped, low-impact website security auditor for your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
scopeguard = "scopeguard.cli:main"

[tool.setuptools.packages.find]
include = ["scopeguard*"]
